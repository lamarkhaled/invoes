<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فاتورة – لمار الحربي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='black'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #111111;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --border-focus: #111111;
    --soft: #f9f9fb;
    --danger: #d70015;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* شريط الأدوات العلوي */
  .toolbar {
    max-width: 820px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: var(--radius);
    position: sticky;
    top: 12px;
    z-index: 20;
  }

  .save-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }

  .save-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34c759;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .btn:hover {
    background: var(--soft);
    border-color: #d1d1d6;
  }

  .btn-primary {
    background: #111111;
    color: #ffffff;
    border-color: #111111;
  }

  .btn-primary:hover {
    background: #2c2c2e;
    border-color: #2c2c2e;
  }

  /* ورقة الفاتورة */
  .invoice-sheet {
    max-width: 820px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 44px 48px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
  }

  /* حقول الإدخال */
  input, textarea {
    font-family: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 5px 8px;
    width: 100%;
    transition: border-color 0.15s ease, background 0.15s ease;
    outline: none;
  }

  input:hover, textarea:hover {
    background: var(--soft);
    border-color: var(--border);
  }

  input:focus, textarea:focus {
    background: #ffffff;
    border-color: var(--border-focus);
  }

  input::placeholder, textarea::placeholder {
    color: #aeaeb2;
  }

  textarea {
    resize: none;
    overflow: hidden;
    min-height: 36px;
    line-height: 1.5;
  }

  /* الترويسة */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  .seller-box {
    flex: 1.3;
  }

  .seller-name {
    font-size: 24px;
    font-weight: 700;
    padding: 4px 8px;
    margin-bottom: 4px;
  }

  .seller-role {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .seller-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    max-width: 380px;
  }

  .seller-meta input {
    font-size: 13px;
    color: var(--muted);
  }

  .invoice-meta {
    flex: 0.9;
    text-align: left;
  }

  .invoice-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
    text-align: left;
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 6px;
  }

  .meta-label {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .meta-input {
    width: 150px;
    text-align: left;
    font-size: 13.5px;
    font-weight: 500;
    direction: ltr;
  }

  /* قسم بيانات العميل */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    padding-right: 8px;
  }

  .client-section {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 30px;
  }

  .client-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 10px;
  }

  .client-name {
    font-size: 15px;
    font-weight: 600;
  }

  .client-sub {
    font-size: 13.5px;
    color: var(--muted);
  }

  /* جدول الخدمات */
  .items-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
  }

  .items-table th {
    text-align: right;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    padding: 10px 8px;
    border-bottom: 1.5px solid #111111;
  }

  .items-table th.num,
  .items-table td.num {
    text-align: center;
    width: 90px;
  }

  .items-table th.price-col,
  .items-table td.price-col {
    text-align: left;
    width: 135px;
  }

  .items-table th.total-col,
  .items-table td.total-col {
    text-align: left;
    width: 135px;
  }

  .items-table th.act-col,
  .items-table td.act-col {
    width: 38px;
    text-align: center;
  }

  .items-table td {
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  .item-desc {
    font-size: 14px;
    font-weight: 500;
  }

  .item-qty {
    text-align: center;
    font-size: 14px;
    direction: ltr;
  }

  .item-price {
    text-align: left;
    font-size: 14px;
    direction: ltr;
  }

  .row-total {
    font-size: 14px;
    font-weight: 600;
    padding: 6px 8px;
    text-align: left;
    direction: ltr;
    white-space: nowrap;
  }

  .remove-btn {
    background: transparent;
    border: none;
    color: #aeaeb2;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    transition: all 0.15s ease;
  }

  .remove-btn:hover {
    color: var(--danger);
    background: #fff0f1;
  }

  .add-row-wrap {
    margin-bottom: 28px;
  }

  .btn-add {
    font-size: 13px;
    padding: 7px 14px;
    border-style: dashed;
  }

  /* الإجمالي */
  .totals-wrap {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 34px;
  }

  .totals-box {
    width: 280px;
    background: #111111;
    color: #ffffff;
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .totals-label {
    font-size: 14px;
    font-weight: 500;
    opacity: 0.85;
  }

  .totals-value {
    font-size: 20px;
    font-weight: 700;
    direction: ltr;
  }

  /* بيانات التحويل والملاحظات */
  .footer-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 20px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .bank-card, .notes-card {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }

  .bank-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .bank-row span {
    font-size: 12.5px;
    color: var(--muted);
    min-width: 78px;
  }

  .bank-row input {
    font-size: 13px;
    font-weight: 500;
  }

  .iban-input {
    direction: ltr;
    text-align: right;
    letter-spacing: 0.4px;
  }

  .notes-input {
    font-size: 13px;
    color: var(--muted);
    min-height: 82px;
  }

  /* تجاوب الجوال */
  @media (max-width: 700px) {
    .invoice-sheet {
      padding: 24px 18px;
    }
    .header {
      flex-direction: column;
    }
    .invoice-meta, .invoice-title {
      text-align: right;
      width: 100%;
    }
    .meta-row {
      justify-content: flex-start;
    }
    .client-grid, .footer-grid, .seller-meta {
      grid-template-columns: 1fr;
    }
    .totals-box {
      width: 100%;
    }
  }

  /* تنسيق الطباعة و PDF */
  @media print {
    @page {
      size: A4;
      margin: 12mm;
    }

    body {
      background: #ffffff;
      padding: 0;
    }

    .no-print {
      display: none !important;
    }

    .invoice-sheet {
      border: none;
      box-shadow: none;
      padding: 0;
      max-width: 100%;
    }

    input, textarea {
      border-color: transparent !important;
      background: transparent !important;
      padding-right: 0;
      padding-left: 0;
    }

    input::placeholder, textarea::placeholder {
      color: transparent !important;
    }

    .client-section, .bank-card, .notes-card {
      background: #fafafa !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .totals-box {
      background: #111111 !important;
      color: #ffffff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

  <!-- شريط التحكم -->
  <div class="toolbar no-print">
    <div class="save-status">
      <span class="save-dot" id="saveDot"></span>
      <span id="saveText">جميع البيانات محفوظة تلقائياً</span>
    </div>
    <div class="toolbar-actions">
      <button type="button" class="btn" id="newInvoiceBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        فاتورة جديدة
      </button>
      <button type="button" class="btn btn-primary" onclick="window.print()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        طباعة / حفظ PDF
      </button>
    </div>
  </div>

  <!-- ورقة الفاتورة -->
  <main class="invoice-sheet">
    <!-- الترويسة -->
    <header class="header">
      <div class="seller-box">
        <input type="text" id="sellerName" class="seller-name" placeholder="اسمك أو اسم نشاطك">
        <input type="text" id="sellerRole" class="seller-role" placeholder="المسمى أو مجال العمل (اختياري)">
        <div class="seller-meta">
          <input type="text" id="sellerPhone" placeholder="رقم الجوال">
          <input type="text" id="sellerEmail" placeholder="البريد الإلكتروني">
        </div>
      </div>

      <div class="invoice-meta">
        <div class="invoice-title">فاتورة</div>
        <div class="meta-row">
          <span class="meta-label">رقم الفاتورة</span>
          <input type="text" id="invoiceNumber" class="meta-input" placeholder="INV-001">
        </div>
        <div class="meta-row">
          <span class="meta-label">تاريخ الإصدار</span>
          <input type="date" id="invoiceDate" class="meta-input">
        </div>
      </div>
    </header>

    <!-- بيانات العميل -->
    <section class="client-section">
      <div class="section-label">فاتورة إلى (بيانات العميل)</div>
      <div class="client-grid">
        <input type="text" id="clientName" class="client-name" placeholder="اسم العميل أو الجهة">
        <input type="text" id="clientPhone" class="client-sub" placeholder="رقم جوال العميل">
        <input type="text" id="clientEmail" class="client-sub" placeholder="البريد الإلكتروني (اختياري)">
      </div>
    </section>

    <!-- جدول الخدمات -->
    <table class="items-table">
      <thead>
        <tr>
          <th>الخدمة / الوصف</th>
          <th class="num">الكمية</th>
          <th class="price-col">السعر (ر.س)</th>
          <th class="total-col">الإجمالي</th>
          <th class="act-col no-print"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <div class="add-row-wrap no-print">
      <button type="button" class="btn btn-add" id="addItemBtn">+ إضافة خدمة</button>
    </div>

    <!-- الإجمالي النهائي بدون ضريبة -->
    <div class="totals-wrap">
      <div class="totals-box">
        <span class="totals-label">الإجمالي المستحق</span>
        <span class="totals-value" id="grandTotal">0.00 ر.س</span>
      </div>
    </div>

    <!-- بيانات التحويل البنكي والملاحظات -->
    <footer class="footer-grid">
      <div class="bank-card">
        <div class="section-label" style="padding-right:0;">بيانات التحويل البنكي</div>
        <div class="bank-row">
          <span>البنك</span>
          <input type="text" id="bankName" placeholder="اسم البنك">
        </div>
        <div class="bank-row">
          <span>المستفيد</span>
          <input type="text" id="bankHolder" placeholder="اسم صاحب الحساب">
        </div>
        <div class="bank-row">
          <span>الآيبان</span>
          <input type="text" id="bankIban" class="iban-input" placeholder="SA00 0000 0000 0000 0000 0000">
        </div>
      </div>

      <div class="notes-card">
        <div class="section-label" style="padding-right:0;">ملاحظات</div>
        <textarea id="invoiceNotes" class="notes-input" placeholder="أضيفي أي ملاحظات أو شروط للدفع هنا..."></textarea>
      </div>
    </footer>
  </main>

<script>
  const SELLER_STORAGE_KEY = 'lamar_invoice_seller_v1';
  const INVOICE_STORAGE_KEY = 'lamar_invoice_current_v1';

  const defaultSeller = {
    name: 'لمار الحربي',
    role: 'تصميم مواقع ومتاجر إلكترونية',
    phone: '',
    email: '',
    bankName: '',
    bankHolder: 'لمار الحربي',
    bankIban: ''
  };

  function getTodayDate() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now - offset).toISOString().split('T')[0];
  }

  function createEmptyInvoice(invoiceNo = 'INV-001') {
    return {
      invoiceNumber: invoiceNo,
      invoiceDate: getTodayDate(),
      clientName: '',
      clientPhone: '',
      clientEmail: '',
      notes: '',
      items: [
        { desc: '', qty: 1, price: '' }
      ]
    };
  }

  function incrementInvoiceNumber(current) {
    const match = (current || '').match(/^(.*?)(\d+)$/);
    if (!match) return 'INV-001';
    const prefix = match[1];
    const numStr = match[2];
    const nextNum = String(parseInt(numStr, 10) + 1).padStart(numStr.length, '0');
    return prefix + nextNum;
  }

  let sellerData = { ...defaultSeller };
  let invoiceData = createEmptyInvoice();

  const saveDot = document.getElementById('saveDot');
  const saveText = document.getElementById('saveText');
  let saveTimer;

  function showSavedFeedback() {
    saveText.textContent = 'تم الحفظ تلقائياً';
    saveDot.style.transform = 'scale(1.3)';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveDot.style.transform = 'scale(1)';
    }, 300);
  }

  function loadAll() {
    try {
      const savedSeller = localStorage.getItem(SELLER_STORAGE_KEY);
      if (savedSeller) {
        sellerData = { ...defaultSeller, ...JSON.parse(savedSeller) };
      }
      const savedInvoice = localStorage.getItem(INVOICE_STORAGE_KEY);
      if (savedInvoice) {
        const parsed = JSON.parse(savedInvoice);
        invoiceData = {
          ...createEmptyInvoice(),
          ...parsed,
          items: Array.isArray(parsed.items) && parsed.items.length > 0
            ? parsed.items
            : [{ desc: '', qty: 1, price: '' }]
        };
      }
    } catch (e) {
      console.error('Error loading saved data', e);
    }
  }

  function saveSeller() {
    localStorage.setItem(SELLER_STORAGE_KEY, JSON.stringify(sellerData));
    showSavedFeedback();
  }

  function saveInvoice() {
    localStorage.setItem(INVOICE_STORAGE_KEY, JSON.stringify(invoiceData));
    showSavedFeedback();
  }

  function formatMoney(value) {
    const num = Number(value) || 0;
    return num.toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + ' ر.س';
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function updateTotals() {
    let total = 0;
    const rows = document.querySelectorAll('#itemsBody tr');
    invoiceData.items.forEach((item, index) => {
      const qty = parseFloat(item.qty) || 0;
      const price = parseFloat(item.price) || 0;
      const rowSum = qty * price;
      total += rowSum;
      if (rows[index]) {
        rows[index].querySelector('.row-total').textContent = formatMoney(rowSum);
      }
    });
    document.getElementById('grandTotal').textContent = formatMoney(total);
  }

  function renderItems() {
    const tbody = document.getElementById('itemsBody');
    tbody.innerHTML = '';

    invoiceData.items.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <textarea class="item-desc" rows="1" placeholder="اكتبي اسم الخدمة أو تفاصيلها...">${item.desc || ''}</textarea>
        </td>
        <td class="num">
          <input type="number" min="0" step="any" class="item-qty" value="${item.qty ?? 1}">
        </td>
        <td class="price-col">
          <input type="number" min="0" step="any" class="item-price" placeholder="0.00" value="${item.price ?? ''}">
        </td>
        <td class="total-col">
          <div class="row-total">0.00 ر.س</div>
        </td>
        <td class="act-col no-print">
          <button type="button" class="remove-btn" title="حذف الخدمة">&times;</button>
        </td>
      `;

      const descEl = tr.querySelector('.item-desc');
      const qtyEl = tr.querySelector('.item-qty');
      const priceEl = tr.querySelector('.item-price');
      const removeBtn = tr.querySelector('.remove-btn');

      descEl.addEventListener('input', (e) => {
        autoResize(e.target);
        invoiceData.items[index].desc = e.target.value;
        saveInvoice();
      });

      qtyEl.addEventListener('input', (e) => {
        invoiceData.items[index].qty = e.target.value;
        updateTotals();
        saveInvoice();
      });

      priceEl.addEventListener('input', (e) => {
        invoiceData.items[index].price = e.target.value;
        updateTotals();
        saveInvoice();
      });

      removeBtn.addEventListener('click', () => {
        if (invoiceData.items.length > 1) {
          invoiceData.items.splice(index, 1);
        } else {
          invoiceData.items[0] = { desc: '', qty: 1, price: '' };
        }
        saveInvoice();
        renderItems();
      });

      tbody.appendChild(tr);
      autoResize(descEl);
    });

    updateTotals();
  }

  function bindFields() {
    const sellerMap = {
      sellerName: 'name',
      sellerRole: 'role',
      sellerPhone: 'phone',
      sellerEmail: 'email',
      bankName: 'bankName',
      bankHolder: 'bankHolder',
      bankIban: 'bankIban'
    };

    Object.entries(sellerMap).forEach(([id, key]) => {
      const el = document.getElementById(id);
      el.value = sellerData[key] || '';
      el.addEventListener('input', (e) => {
        sellerData[key] = e.target.value;
        saveSeller();
      });
    });

    const invoiceMap = {
      invoiceNumber: 'invoiceNumber',
      invoiceDate: 'invoiceDate',
      clientName: 'clientName',
      clientPhone: 'clientPhone',
      clientEmail: 'clientEmail',
      invoiceNotes: 'notes'
    };

    Object.entries(invoiceMap).forEach(([id, key]) => {
      const el = document.getElementById(id);
      el.value = invoiceData[key] || '';
      if (el.tagName === 'TEXTAREA') autoResize(el);
      el.addEventListener('input', (e) => {
        if (e.target.tagName === 'TEXTAREA') autoResize(e.target);
        invoiceData[key] = e.target.value;
        saveInvoice();
      });
    });
  }

  document.getElementById('addItemBtn').addEventListener('click', () => {
    invoiceData.items.push({ desc: '', qty: 1, price: '' });
    saveInvoice();
    renderItems();
    const inputs = document.querySelectorAll('.item-desc');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  document.getElementById('newInvoiceBtn').addEventListener('click', () => {
    const confirmed = confirm('هل تريدين إنشاء فاتورة جديدة؟ سيتم تفريغ بيانات العميل والخدمات الحالية مع الاحتفاظ ببياناتك الشخصية والبنكية.');
    if (!confirmed) return;

    const nextNo = incrementInvoiceNumber(invoiceData.invoiceNumber);
    invoiceData = createEmptyInvoice(nextNo);
    saveInvoice();
    bindFields();
    renderItems();
  });

  loadAll();
  bindFields();
  renderItems();
</script>
</body>
</html>
