<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فاتورة – لمار الحربي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='black'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #111111;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --accent: #111111;
    --soft: #f9f9fb;
    --danger: #d70015;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* شريط التحكم والتخصيص */
  .toolbar {
    max-width: 840px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: var(--radius);
    position: sticky;
    top: 12px;
    z-index: 20;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .save-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }

  .save-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34c759;
    transition: transform 0.2s ease;
  }

  .custom-control {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--soft);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 9px;
    cursor: pointer;
  }

  .color-picker {
    width: 22px;
    height: 22px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .mini-input {
    width: 48px !important;
    padding: 2px 4px !important;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    background: #fff !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
  }

  .toggle-check {
    width: 15px !important;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .btn:hover {
    background: var(--soft);
    border-color: #d1d1d6;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  /* ورقة الفاتورة */
  .invoice-sheet {
    max-width: 840px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 42px 46px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
  }

  input, textarea, select {
    font-family: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 5px 8px;
    width: 100%;
    transition: border-color 0.15s ease, background 0.15s ease;
    outline: none;
  }

  input:hover, textarea:hover, select:hover {
    background: var(--soft);
    border-color: var(--border);
  }

  input:focus, textarea:focus, select:focus {
    background: #ffffff;
    border-color: var(--accent);
  }

  input::placeholder, textarea::placeholder {
    color: #aeaeb2;
  }

  textarea {
    resize: none;
    overflow: hidden;
    min-height: 36px;
    line-height: 1.55;
  }

  /* الترويسة والشعار */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    padding-bottom: 26px;
    border-bottom: 1.5px solid var(--border);
    margin-bottom: 26px;
  }

  .seller-wrap {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex: 1.45;
  }

  .logo-box {
    width: 82px;
    height: 82px;
    border-radius: 14px;
    border: 1.5px dashed var(--border);
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }

  .logo-box:hover {
    border-color: var(--accent);
  }

  .logo-box.has-logo {
    border: none;
    background: transparent;
  }

  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .logo-placeholder {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 6px;
    line-height: 1.4;
  }

  .logo-remove {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .logo-box.has-logo:hover .logo-remove {
    display: flex;
  }

  .seller-box {
    flex: 1;
  }

  .seller-name {
    font-size: 22px;
    font-weight: 700;
    padding: 2px 6px;
    margin-bottom: 2px;
  }

  .seller-role {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 8px;
    padding: 2px 6px;
  }

  .seller-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 8px;
    max-width: 390px;
  }

  .seller-meta input {
    font-size: 12.5px;
    color: var(--muted);
    padding: 3px 6px;
  }

  .social-input {
    direction: ltr;
    text-align: right;
  }

  .invoice-meta {
    flex: 0.8;
    text-align: left;
  }

  .invoice-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    text-align: left;
    padding: 2px 6px;
    margin-bottom: 10px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 5px;
  }

  .meta-label {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .meta-input {
    width: 145px;
    text-align: left;
    font-size: 13px;
    font-weight: 500;
    direction: ltr;
  }

  /* عناوين الأقسام القابلة للتخصيص */
  .section-title-input {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    padding: 2px 6px;
    margin-bottom: 8px;
  }

  /* بيانات العميل */
  .client-section {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 26px;
  }

  .client-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 8px;
  }

  .client-name {
    font-size: 14.5px;
    font-weight: 600;
  }

  .client-sub {
    font-size: 13px;
    color: var(--muted);
  }

  /* جدول الخدمات */
  .items-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
  }

  .items-table th {
    text-align: right;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    padding: 10px 8px;
    border-bottom: 2px solid var(--accent);
  }

  .items-table th.num,
  .items-table td.num {
    text-align: center;
    width: 85px;
  }

  .items-table th.price-col,
  .items-table td.price-col {
    text-align: left;
    width: 130px;
  }

  .items-table th.total-col,
  .items-table td.total-col {
    text-align: left;
    width: 135px;
  }

  .items-table th.act-col,
  .items-table td.act-col {
    width: 36px;
    text-align: center;
  }

  .items-table td {
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  .item-desc {
    font-size: 14px;
    font-weight: 500;
  }

  .item-qty {
    text-align: center;
    font-size: 14px;
    direction: ltr;
  }

  .item-price {
    text-align: left;
    font-size: 14px;
    direction: ltr;
  }

  .row-total {
    font-size: 14px;
    font-weight: 600;
    padding: 6px 8px;
    text-align: left;
    direction: ltr;
    white-space: nowrap;
  }

  .remove-btn {
    background: transparent;
    border: none;
    color: #aeaeb2;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    transition: all 0.15s ease;
  }

  .remove-btn:hover {
    color: var(--danger);
    background: #fff0f1;
  }

  .add-row-wrap {
    margin-bottom: 24px;
  }

  .btn-add {
    font-size: 13px;
    padding: 7px 14px;
    border-style: dashed;
  }

  /* الملخص والخصم والإجمالي وجدول الدفعات */
  .totals-wrap {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 28px;
  }

  .totals-card {
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .summary-val {
    font-weight: 600;
    color: var(--text);
    direction: ltr;
  }

  .discount-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .discount-input {
    width: 82px;
    text-align: left;
    direction: ltr;
    font-size: 13.5px;
    font-weight: 600;
    background: var(--soft);
    border: 1px solid var(--border);
    padding: 4px 8px;
  }

  .discount-type {
    width: 62px;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--soft);
    border: 1px solid var(--border);
    padding: 4px 6px;
    cursor: pointer;
  }

  .grand-box {
    background: var(--accent);
    color: #ffffff;
    border-radius: 12px;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .grand-label {
    font-size: 14px;
    font-weight: 500;
    opacity: 0.9;
  }

  .grand-value {
    font-size: 20px;
    font-weight: 700;
    direction: ltr;
  }

  /* بطاقة تقسيم الدفعات 50% قبل و 50% بعد */
  .payment-split-box {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .split-header {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    padding-right: 4px;
  }

  .split-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .split-label-input {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    padding: 2px 4px;
  }

  .split-amount {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent);
    direction: ltr;
    white-space: nowrap;
  }

  .split-divider {
    height: 1px;
    background: var(--border);
    margin: 2px 0;
  }

  /* بيانات التحويل البنكي والشروط */
  .footer-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 18px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  .info-card {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .bank-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .bank-row span {
    font-size: 12px;
    color: var(--muted);
    min-width: 72px;
  }

  .bank-row input {
    font-size: 13px;
    font-weight: 500;
    padding: 4px 6px;
  }

  .ltr-input {
    direction: ltr;
    text-align: right;
    letter-spacing: 0.3px;
  }

  .terms-input {
    font-size: 12.5px;
    color: var(--muted);
    min-height: 92px;
  }

  @media (max-width: 700px) {
    .invoice-sheet {
      padding: 22px 16px;
    }
    .header {
      flex-direction: column;
    }
    .seller-wrap {
      width: 100%;
    }
    .invoice-meta, .invoice-title {
      text-align: right;
      width: 100%;
    }
    .meta-row {
      justify-content: flex-start;
    }
    .client-grid, .footer-grid, .seller-meta {
      grid-template-columns: 1fr;
    }
    .totals-card {
      width: 100%;
    }
  }

  /* تنسيق الطباعة و PDF */
  @media print {
    @page {
      size: A4;
      margin: 12mm;
    }

    body {
      background: #ffffff;
      padding: 0;
    }

    .no-print {
      display: none !important;
    }

    .invoice-sheet {
      border: none;
      box-shadow: none;
      padding: 0;
      max-width: 100%;
    }

    input, textarea, select {
      border-color: transparent !important;
      background: transparent !important;
      padding-right: 0;
      padding-left: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    input::placeholder, textarea::placeholder {
      color: transparent !important;
    }

    .logo-box:not(.has-logo) {
      display: none !important;
    }

    .hide-on-print {
      display: none !important;
    }

    .client-section, .info-card, .payment-split-box {
      background: #fafafa !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .grand-box {
      background: var(--accent) !important;
      color: #ffffff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

  <!-- شريط الأدوات والتخصيص -->
  <div class="toolbar no-print">
    <div class="toolbar-group">
      <div class="save-status">
        <span class="save-dot" id="saveDot"></span>
        <span id="saveText">محفوظ تلقائياً</span>
      </div>
      <label class="custom-control" title="تغيير اللون الأساسي للفاتورة">
        <span>اللون</span>
        <input type="color" id="accentColor" class="color-picker" value="#111111">
      </label>
      <label class="custom-control" title="تغيير رمز العملة">
        <span>العملة</span>
        <input type="text" id="currencySymbol" class="mini-input" value="ر.س">
      </label>
      <label class="custom-control" title="إظهار أو تعديل نسبة العربون">
        <input type="checkbox" id="showDepositToggle" class="toggle-check" checked>
        <span>عربون</span>
        <input type="number" id="depositPercent" class="mini-input" min="0" max="100" value="50">
        <span>%</span>
      </label>
    </div>

    <div class="toolbar-group">
      <button type="button" class="btn" id="newInvoiceBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        فاتورة جديدة
      </button>
      <button type="button" class="btn btn-primary" onclick="window.print()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        طباعة / PDF
      </button>
    </div>
  </div>

  <!-- ورقة الفاتورة -->
  <main class="invoice-sheet">
    <!-- الترويسة -->
    <header class="header">
      <div class="seller-wrap">
        <div class="logo-box" id="logoBox" title="اضغطي لرفع الشعار">
          <span class="logo-placeholder" id="logoPlaceholder">رفع<br>الشعار</span>
          <img id="logoPreview" style="display:none;" alt="شعار">
          <button type="button" class="logo-remove no-print" id="removeLogoBtn" title="حذف الشعار">&times;</button>
          <input type="file" id="logoInput" accept="image/*" style="display:none;">
        </div>

        <div class="seller-box">
          <input type="text" id="sellerName" class="seller-name" placeholder="اسمك أو اسم نشاطك">
          <input type="text" id="sellerRole" class="seller-role" placeholder="المسمى أو مجال العمل">
          <div class="seller-meta">
            <input type="text" id="sellerPhone" placeholder="رقم الجوال">
            <input type="text" id="sellerEmail" placeholder="البريد الإلكتروني">
            <input type="text" id="sellerSocial" class="social-input" placeholder="حساب السوشال ميديا (@username)">
          </div>
        </div>
      </div>

      <div class="invoice-meta">
        <input type="text" id="invoiceTitle" class="invoice-title" value="فاتورة">
        <div class="meta-row">
          <span class="meta-label">رقم الفاتورة</span>
          <input type="text" id="invoiceNumber" class="meta-input" placeholder="INV-001">
        </div>
        <div class="meta-row">
          <span class="meta-label">تاريخ الإصدار</span>
          <input type="date" id="invoiceDate" class="meta-input">
        </div>
      </div>
    </header>

    <!-- بيانات العميل -->
    <section class="client-section">
      <input type="text" id="clientSectionTitle" class="section-title-input" value="فاتورة إلى (بيانات العميل)">
      <div class="client-grid">
        <input type="text" id="clientName" class="client-name" placeholder="اسم العميل أو الجهة">
        <input type="text" id="clientPhone" class="client-sub" placeholder="رقم جوال العميل">
        <input type="text" id="clientEmail" class="client-sub" placeholder="البريد الإلكتروني (اختياري)">
      </div>
    </section>

    <!-- جدول الخدمات -->
    <table class="items-table">
      <thead>
        <tr>
          <th>الخدمة / الوصف</th>
          <th class="num">الكمية</th>
          <th class="price-col">السعر (<span class="curr-label">ر.س</span>)</th>
          <th class="total-col">الإجمالي</th>
          <th class="act-col no-print"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <div class="add-row-wrap no-print">
      <button type="button" class="btn btn-add" id="addItemBtn">+ إضافة خدمة</button>
    </div>

    <!-- الملخص والخصم والإجمالي وجدول الدفعات -->
    <div class="totals-wrap">
      <div class="totals-card">
        <div class="summary-row" id="subtotalRow">
          <span>المجموع الفرعي</span>
          <span class="summary-val" id="subtotalVal">0.00 ر.س</span>
        </div>

        <div class="summary-row" id="discountRow">
          <span>الخصم</span>
          <div class="discount-controls">
            <input type="number" min="0" step="any" id="discountValue" class="discount-input" placeholder="0">
            <select id="discountType" class="discount-type">
              <option value="amount">ر.س</option>
              <option value="percent">%</option>
            </select>
          </div>
        </div>

        <div class="grand-box">
          <span class="grand-label">الإجمالي المستحق</span>
          <span class="grand-value" id="grandTotal">0.00 ر.س</span>
        </div>

        <!-- تفصيل الدفعات: 50% عربون قبل و 50% بعد -->
        <div class="payment-split-box" id="paymentSplitBox">
          <div class="split-header">تفصيل الدفعات</div>
          <div class="split-row">
            <input type="text" id="depositBeforeLabel" class="split-label-input" value="الدفعة الأولى (عربون 50% قبل البدء)">
            <span class="split-amount" id="depositBeforeVal">0.00 ر.س</span>
          </div>
          <div class="split-divider"></div>
          <div class="split-row">
            <input type="text" id="depositAfterLabel" class="split-label-input" value="الدفعة الثانية (50% بعد الانتهاء)">
            <span class="split-amount" id="depositAfterVal">0.00 ر.س</span>
          </div>
        </div>
      </div>
    </div>

    <!-- بيانات التحويل والشروط والأحكام -->
    <footer class="footer-grid">
      <div class="info-card">
        <input type="text" id="bankSectionTitle" class="section-title-input" value="بيانات التحويل البنكي">
        <div class="bank-row">
          <span>اسم البنك</span>
          <input type="text" id="bankName" placeholder="مثال: مصرف الراجحي">
        </div>
        <div class="bank-row">
          <span>اسم المستفيد</span>
          <input type="text" id="bankHolder" placeholder="الاسم الثلاثي أو التجاري">
        </div>
        <div class="bank-row">
          <span>رقم الحساب</span>
          <input type="text" id="bankAccount" class="ltr-input" placeholder="00000000000000">
        </div>
        <div class="bank-row">
          <span>رقم الآيبان</span>
          <input type="text" id="bankIban" class="ltr-input" placeholder="SA00 0000 0000 0000 0000 0000">
        </div>
      </div>

      <div class="info-card">
        <input type="text" id="termsSectionTitle" class="section-title-input" value="الشروط والأحكام">
        <textarea id="sellerTerms" class="terms-input" placeholder="اكتبي شروط العمل والدفع هنا..."></textarea>
      </div>
    </footer>
  </main>

<script>
  const SELLER_STORAGE_KEY = 'lamar_invoice_seller_v4';
  const INVOICE_STORAGE_KEY = 'lamar_invoice_current_v4';

  const defaultSeller = {
    name: 'لمار الحربي',
    role: 'تصميم مواقع ومتاجر إلكترونية',
    phone: '',
    email: '',
    social: '@lamaralharbi_sa',
    logo: '',
    accentColor: '#111111',
    currency: 'ر.س',
    showDeposit: true,
    depositPercent: 50,
    depositBeforeLabel: 'الدفعة الأولى (عربون 50% قبل البدء)',
    depositAfterLabel: 'الدفعة الثانية (50% بعد الانتهاء)',
    invoiceTitle: 'فاتورة',
    clientSectionTitle: 'فاتورة إلى (بيانات العميل)',
    bankSectionTitle: 'بيانات التحويل البنكي',
    termsSectionTitle: 'الشروط والأحكام',
    bankName: '',
    bankHolder: 'لمار الحربي',
    bankAccount: '',
    bankIban: '',
    terms: '• يُدفع عربون بنسبة 50% من إجمالي الفاتورة قبل البدء في العمل.\n• يُدفع المبلغ المتبقي (50%) بعد الانتهاء وعند التسليم.\n• العربون غير مسترد بعد البدء في تنفيذ الخدمة.'
  };

  function getTodayDate() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now - offset).toISOString().split('T')[0];
  }

  function createEmptyInvoice(invoiceNo = 'INV-001') {
    return {
      invoiceNumber: invoiceNo,
      invoiceDate: getTodayDate(),
      clientName: '',
      clientPhone: '',
      clientEmail: '',
      discountValue: '',
      discountType: 'amount',
      items: [
        { desc: '', qty: 1, price: '' }
      ]
    };
  }

  function incrementInvoiceNumber(current) {
    const match = (current || '').match(/^(.*?)(\d+)$/);
    if (!match) return 'INV-001';
    const prefix = match[1];
    const numStr = match[2];
    const nextNum = String(parseInt(numStr, 10) + 1).padStart(numStr.length, '0');
    return prefix + nextNum;
  }

  let sellerData = { ...defaultSeller };
  let invoiceData = createEmptyInvoice();

  const saveDot = document.getElementById('saveDot');
  const saveText = document.getElementById('saveText');
  let saveTimer;

  function showSavedFeedback() {
    saveText.textContent = 'تم الحفظ تلقائياً';
    saveDot.style.transform = 'scale(1.3)';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveDot.style.transform = 'scale(1)';
    }, 300);
  }

  function loadAll() {
    try {
      const savedSeller = localStorage.getItem(SELLER_STORAGE_KEY);
      if (savedSeller) {
        sellerData = { ...defaultSeller, ...JSON.parse(savedSeller) };
      }
      const savedInvoice = localStorage.getItem(INVOICE_STORAGE_KEY);
      if (savedInvoice) {
        const parsed = JSON.parse(savedInvoice);
        invoiceData = {
          ...createEmptyInvoice(),
          ...parsed,
          items: Array.isArray(parsed.items) && parsed.items.length > 0
            ? parsed.items
            : [{ desc: '', qty: 1, price: '' }]
        };
      }
    } catch (e) {
      console.error('Error loading saved data', e);
    }
  }

  function saveSeller() {
    localStorage.setItem(SELLER_STORAGE_KEY, JSON.stringify(sellerData));
    showSavedFeedback();
  }

  function saveInvoice() {
    localStorage.setItem(INVOICE_STORAGE_KEY, JSON.stringify(invoiceData));
    showSavedFeedback();
  }

  function applyThemeAndCurrency() {
    document.documentElement.style.setProperty('--accent', sellerData.accentColor || '#111111');
    const curr = sellerData.currency || 'ر.س';
    document.querySelectorAll('.curr-label').forEach(el => el.textContent = curr);
    const amountOpt = document.querySelector('#discountType option[value="amount"]');
    if (amountOpt) amountOpt.textContent = curr;
  }

  function formatMoney(value) {
    const num = Number(value) || 0;
    const curr = sellerData.currency || 'ر.س';
    return num.toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + ' ' + curr;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function renderLogo() {
    const box = document.getElementById('logoBox');
    const img = document.getElementById('logoPreview');
    const placeholder = document.getElementById('logoPlaceholder');

    if (sellerData.logo) {
      img.src = sellerData.logo;
      img.style.display = 'block';
      placeholder.style.display = 'none';
      box.classList.add('has-logo');
    } else {
      img.src = '';
      img.style.display = 'none';
      placeholder.style.display = 'block';
      box.classList.remove('has-logo');
    }
  }

  function updateEmptyPrintVisibility() {
    ['sellerPhone', 'sellerEmail', 'sellerSocial'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      if (!el.value.trim()) {
        el.classList.add('hide-on-print');
      } else {
        el.classList.remove('hide-on-print');
      }
    });
  }

  function updateTotals() {
    let subtotal = 0;
    const rows = document.querySelectorAll('#itemsBody tr');
    invoiceData.items.forEach((item, index) => {
      const qty = parseFloat(item.qty) || 0;
      const price = parseFloat(item.price) || 0;
      const rowSum = qty * price;
      subtotal += rowSum;
      if (rows[index]) {
        rows[index].querySelector('.row-total').textContent = formatMoney(rowSum);
      }
    });

    const discVal = parseFloat(invoiceData.discountValue) || 0;
    let discountAmount = 0;
    if (discVal > 0) {
      discountAmount = invoiceData.discountType === 'percent'
        ? (subtotal * Math.min(discVal, 100)) / 100
        : discVal;
    }

    const grandTotal = Math.max(0, subtotal - discountAmount);

    document.getElementById('subtotalVal').textContent = formatMoney(subtotal);
    document.getElementById('grandTotal').textContent = formatMoney(grandTotal);

    const splitBox = document.getElementById('paymentSplitBox');
    if (sellerData.showDeposit) {
      splitBox.style.display = 'flex';
      const pct = Math.min(100, Math.max(0, parseFloat(sellerData.depositPercent) || 0));
      const beforeAmt = (grandTotal * pct) / 100;
      const afterAmt = Math.max(0, grandTotal - beforeAmt);
      document.getElementById('depositBeforeVal').textContent = formatMoney(beforeAmt);
      document.getElementById('depositAfterVal').textContent = formatMoney(afterAmt);
    } else {
      splitBox.style.display = 'none';
    }

    const discountRow = document.getElementById('discountRow');
    const subtotalRow = document.getElementById('subtotalRow');
    if (discVal <= 0) {
      discountRow.classList.add('hide-on-print');
      subtotalRow.classList.add('hide-on-print');
    } else {
      discountRow.classList.remove('hide-on-print');
      subtotalRow.classList.remove('hide-on-print');
    }
  }

  function renderItems() {
    const tbody = document.getElementById('itemsBody');
    tbody.innerHTML = '';

    invoiceData.items.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <textarea class="item-desc" rows="1" placeholder="اكتبي اسم الخدمة أو تفاصيلها...">${item.desc || ''}</textarea>
        </td>
        <td class="num">
          <input type="number" min="0" step="any" class="item-qty" value="${item.qty ?? 1}">
        </td>
        <td class="price-col">
          <input type="number" min="0" step="any" class="item-price" placeholder="0.00" value="${item.price ?? ''}">
        </td>
        <td class="total-col">
          <div class="row-total">0.00</div>
        </td>
        <td class="act-col no-print">
          <button type="button" class="remove-btn" title="حذف الخدمة">&times;</button>
        </td>
      `;

      const descEl = tr.querySelector('.item-desc');
      const qtyEl = tr.querySelector('.item-qty');
      const priceEl = tr.querySelector('.item-price');
      const removeBtn = tr.querySelector('.remove-btn');

      descEl.addEventListener('input', (e) => {
        autoResize(e.target);
        invoiceData.items[index].desc = e.target.value;
        saveInvoice();
      });

      qtyEl.addEventListener('input', (e) => {
        invoiceData.items[index].qty = e.target.value;
        updateTotals();
        saveInvoice();
      });

      priceEl.addEventListener('input', (e) => {
        invoiceData.items[index].price = e.target.value;
        updateTotals();
        saveInvoice();
      });

      removeBtn.addEventListener('click', () => {
        if (invoiceData.items.length > 1) {
          invoiceData.items.splice(index, 1);
        } else {
          invoiceData.items[0] = { desc: '', qty: 1, price: '' };
        }
        saveInvoice();
        renderItems();
      });

      tbody.appendChild(tr);
      autoResize(descEl);
    });

    updateTotals();
  }

  function bindFields() {
    const sellerMap = {
      sellerName: 'name',
      sellerRole: 'role',
      sellerPhone: 'phone',
      sellerEmail: 'email',
      sellerSocial: 'social',
      accentColor: 'accentColor',
      currencySymbol: 'currency',
      depositBeforeLabel: 'depositBeforeLabel',
      depositAfterLabel: 'depositAfterLabel',
      invoiceTitle: 'invoiceTitle',
      clientSectionTitle: 'clientSectionTitle',
      bankSectionTitle: 'bankSectionTitle',
      termsSectionTitle: 'termsSectionTitle',
      bankName: 'bankName',
      bankHolder: 'bankHolder',
      bankAccount: 'bankAccount',
      bankIban: 'bankIban',
      sellerTerms: 'terms'
    };

    Object.entries(sellerMap).forEach(([id, key]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = sellerData[key] || '';
      if (el.tagName === 'TEXTAREA') autoResize(el);
      el.oninput = (e) => {
        if (e.target.tagName === 'TEXTAREA') autoResize(e.target);
        sellerData[key] = e.target.value;
        if (key === 'accentColor' || key === 'currency') {
          applyThemeAndCurrency();
          updateTotals();
        }
        updateEmptyPrintVisibility();
        saveSeller();
      };
    });

    const depositToggle = document.getElementById('showDepositToggle');
    const depositPctInput = document.getElementById('depositPercent');
    depositToggle.checked = !!sellerData.showDeposit;
    depositPctInput.value = sellerData.depositPercent ?? 50;

    depositToggle.onchange = (e) => {
      sellerData.showDeposit = e.target.checked;
      updateTotals();
      saveSeller();
    };

    depositPctInput.oninput = (e) => {
      const pct = Math.min(100, Math.max(0, parseFloat(e.target.value) || 0));
      const rem = 100 - pct;
      sellerData.depositPercent = pct;
      sellerData.depositBeforeLabel = `الدفعة الأولى (عربون ${pct}% قبل البدء)`;
      sellerData.depositAfterLabel = `الدفعة الثانية (${rem}% بعد الانتهاء)`;
      document.getElementById('depositBeforeLabel').value = sellerData.depositBeforeLabel;
      document.getElementById('depositAfterLabel').value = sellerData.depositAfterLabel;
      updateTotals();
      saveSeller();
    };

    const invoiceMap = {
      invoiceNumber: 'invoiceNumber',
      invoiceDate: 'invoiceDate',
      clientName: 'clientName',
      clientPhone: 'clientPhone',
      clientEmail: 'clientEmail',
      discountValue: 'discountValue',
      discountType: 'discountType'
    };

    Object.entries(invoiceMap).forEach(([id, key]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = invoiceData[key] || '';
      const evt = el.tagName === 'SELECT' ? 'onchange' : 'oninput';
      el[evt] = (e) => {
        invoiceData[key] = e.target.value;
        updateTotals();
        saveInvoice();
      };
    });

    updateEmptyPrintVisibility();
  }

  const logoBox = document.getElementById('logoBox');
  const logoInput = document.getElementById('logoInput');
  const removeLogoBtn = document.getElementById('removeLogoBtn');

  logoBox.addEventListener('click', (e) => {
    if (e.target === removeLogoBtn) return;
    logoInput.click();
  });

  logoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      sellerData.logo = ev.target.result;
      renderLogo();
      saveSeller();
    };
    reader.readAsDataURL(file);
    logoInput.value = '';
  });

  removeLogoBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sellerData.logo = '';
    renderLogo();
    saveSeller();
  });

  document.getElementById('addItemBtn').addEventListener('click', () => {
    invoiceData.items.push({ desc: '', qty: 1, price: '' });
    saveInvoice();
    renderItems();
    const inputs = document.querySelectorAll('.item-desc');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  document.getElementById('newInvoiceBtn').addEventListener('click', () => {
    const confirmed = confirm('هل تريدين إنشاء فاتورة جديدة؟ سيتم تفريغ بيانات العميل والخدمات والخصم فقط مع الاحتفاظ ببياناتك وشعارك والبنك والشروط.');
    if (!confirmed) return;

    const nextNo = incrementInvoiceNumber(invoiceData.invoiceNumber);
    invoiceData = createEmptyInvoice(nextNo);
    saveInvoice();
    bindFields();
    renderItems();
  });

  loadAll();
  applyThemeAndCurrency();
  renderLogo();
  bindFields();
  renderItems();
</script>
</body>
</html>
